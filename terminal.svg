<svg width="840" height="310" viewBox="0 0 840 310" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="termGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#48bfe3"/>
    </linearGradient>
    <clipPath id="termClip">
      <rect x="0" y="0" width="840" height="310" rx="12"/>
    </clipPath>
  </defs>

  <!-- Terminal window -->
  <g clip-path="url(#termClip)">

    <!-- Window background -->
    <rect width="840" height="310" rx="12" fill="#0f0f17" stroke="#1e1e30" stroke-width="1.5"/>

    <!-- Title bar -->
    <rect width="840" height="36" fill="#141420"/>
    <line x1="0" y1="36" x2="840" y2="36" stroke="#1e1e30" stroke-width="1"/>

    <!-- Traffic light buttons -->
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>

    <!-- Window title -->
    <text x="420" y="23"
          font-family="'SF Mono','Courier New',monospace"
          font-size="12"
          fill="#5a5a72"
          text-anchor="middle">
      vishal@dev ~ zsh
    </text>

    <!-- ===== Terminal content ===== -->

    <!-- Command 1: whoami -->
    <text x="24" y="68"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13.5"
          fill="#6c63ff"
          font-weight="bold">~$</text>
    <text x="48" y="68"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13.5"
          fill="#e2e2f0"> whoami</text>

    <!-- Output -->
    <text x="24" y="94"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#8888a0">&#x276F;</text>
    <text x="40" y="94"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#e2e2f0"> Software Engineer II</text>
    <text x="248" y="94"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#5a5a72"> @ </text>
    <text x="272" y="94"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#48bfe3">Tekion Corp</text>

    <text x="24" y="116"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#8888a0">&#x276F;</text>
    <text x="40" y="116"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#e2e2f0"> 4+ years building high-throughput backend systems</text>

    <text x="24" y="138"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#8888a0">&#x276F;</text>
    <text x="40" y="138"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#e2e2f0"> Java</text>
    <text x="82" y="138"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#5a5a72"> &#x2022; </text>
    <text x="102" y="138"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#e2e2f0">Spring Boot</text>
    <text x="192" y="138"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#5a5a72"> &#x2022; </text>
    <text x="212" y="138"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#e2e2f0">Kafka</text>
    <text x="254" y="138"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#5a5a72"> &#x2022; </text>
    <text x="274" y="138"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#e2e2f0">Microservices</text>

    <!-- Command 2: stats -->
    <text x="24" y="172"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13.5"
          fill="#6c63ff"
          font-weight="bold">~$</text>
    <text x="48" y="172"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13.5"
          fill="#e2e2f0"> stats --highlights</text>

    <!-- Stats output as key:value -->
    <text x="40" y="198"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#6c63ff">microservices</text>
    <text x="164" y="198"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#5a5a72"> : </text>
    <text x="180" y="198"
          font-family="'SF Mono','Courier New',monospace"
