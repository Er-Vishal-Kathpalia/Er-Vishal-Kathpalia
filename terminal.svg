          fill="#48bfe3">12+ built &amp; maintained</text>

    <text x="40" y="220"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#6c63ff">perf_boost</text>
    <text x="132" y="220"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#5a5a72">   : </text>
    <text x="180" y="220"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#48bfe3">90x (90s down to &lt;1s)</text>

    <text x="40" y="242"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#6c63ff">migrations</text>
    <text x="132" y="242"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#5a5a72">   : </text>
    <text x="180" y="242"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#48bfe3">millions of records, zero data loss</text>

    <text x="40" y="264"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#6c63ff">features</text>
    <text x="108" y="264"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#5a5a72">     : </text>
    <text x="180" y="264"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13"
          fill="#48bfe3">20+ shipped to production</text>

    <!-- Next prompt with blinking cursor -->
    <text x="24" y="294"
          font-family="'SF Mono','Courier New',monospace"
          font-size="13.5"
          fill="#6c63ff"
          font-weight="bold">~$</text>
    <rect x="48" y="282" width="8" height="15" rx="1" fill="#6c63ff">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

