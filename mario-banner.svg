<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">

  <!-- Sky -->
  <rect width="1200" height="340" fill="#5c94fc"/>

  <!-- Clouds (Moved to Left) -->
  <circle cx="120" cy="70" r="25" fill="white"/>
  <circle cx="150" cy="70" r="30" fill="white"/>
  <circle cx="180" cy="70" r="25" fill="white"/>

  <!-- Ground -->
  <rect y="260" width="1200" height="80" fill="#8B4513"/>

  <!-- Brick Platform (Left Gameplay Area) -->
  <rect x="140" y="220" width="60" height="40" fill="#b5521f"/>
  <rect x="200" y="220" width="60" height="40" fill="#b5521f"/>
  <rect x="260" y="220" width="60" height="40" fill="#b5521f"/>

  <!-- Pipe (Right Side Decorative) -->
  <rect x="950" y="210" width="100" height="130" fill="#2faa2f"/>
  <rect x="930" y="190" width="140" height="30" fill="#36c936"/>

  <!-- Animated Coin -->
  <g>
    <circle cx="230" cy="150" r="24" fill="#FFD700">
      <animate attributeName="cy"
               values="150;115;150"
               dur="0.9s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="140" r="6" fill="#fff8dc">
      <animate attributeName="cy"
               values="140;105;140"
               dur="0.9s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Mario -->
  <g transform="translate(150,195)">
    <rect x="20" y="0" width="40" height="15" fill="#d62828"/>
    <rect x="25" y="15" width="30" height="25" fill="#f1c27d"/>
    <rect x="20" y="40" width="40" height="35" fill="#0033a0"/>
    <rect x="5" y="40" width="15" height="10" fill="#f1c27d"/>
    <rect x="60" y="40" width="15" height="10" fill="#f1c27d"/>
    <rect x="20" y="75" width="15" height="25" fill="#8b0000"/>
    <rect x="45" y="75" width="15" height="25" fill="#8b0000"/>
  </g>

  <!-- Name -->
  <text x="600" y="135"
        font-family="Verdana"
        font-size="52"
        fill="#ffffff"
        text-anchor="middle"
        font-weight="bold">
        VISHAL KATHPALIA
  </text>

  <!-- Designation -->
  <text x="600" y="175"
        font-family="Verdana"
        font-size="22"
        fill="#ffffff"
        text-anchor="middle">
        Backend Engineer • Microservices • Distributed Systems
  </text>

</svg>
