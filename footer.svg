<svg width="1200" height="80" viewBox="0 0 1200 80" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="footerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="50%" stop-color="#8b83ff"/>
      <stop offset="100%" stop-color="#48bfe3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="80" fill="#0a0a0f"/>

  <!-- Scattered particles -->
  <circle cx="60" cy="25" r="1.5" fill="#6c63ff" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="55" r="1" fill="#48bfe3" opacity="0.25"/>
  <circle cx="340" cy="20" r="1.5" fill="#6c63ff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.08;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="60" r="1" fill="#8b83ff" opacity="0.25"/>
  <circle cx="700" cy="22" r="1.5" fill="#48bfe3" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.08;0.2" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="58" r="1" fill="#6c63ff" opacity="0.3"/>
  <circle cx="1020" cy="25" r="1.5" fill="#48bfe3" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.1;0.2" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1140" cy="52" r="1" fill="#6c63ff" opacity="0.25"/>

  <!-- Gradient accent line -->
  <rect x="200" y="18" width="800" height="1.5" rx="1" fill="url(#footerGrad)" opacity="0.5"/>

  <!-- VK branding -->
  <text x="600" y="55"
        font-family="'SF Mono','Courier New',monospace"
        font-size="13"
        fill="#5a5a72"
        text-anchor="middle"
        letter-spacing="2">
    &lt;VK /&gt;
  </text>

</svg>
