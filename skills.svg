<svg width="840" height="340" viewBox="0 0 840 340" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#48bfe3"/>
    </linearGradient>
    <linearGradient id="sGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b83ff"/>
      <stop offset="100%" stop-color="#6c63ff"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="0" y="0" width="320" height="12" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="840" height="340" rx="12" fill="#0f0f17" stroke="#1e1e30" stroke-width="1.5"/>

  <!-- Title -->
  <text x="420" y="32"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="13"
        fill="#5a5a72"
        text-anchor="middle"
        letter-spacing="3">
    SKILL PROFICIENCY
  </text>

  <!-- ===== Left Column ===== -->

  <!-- Java -->
  <g transform="translate(50, 58)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">Java</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">95%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad)">
        <animate attributeName="width" from="0" to="304" dur="1.5s" begin="0.2s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Spring Boot -->
  <g transform="translate(50, 108)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">Spring Boot</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">92%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad)">
        <animate attributeName="width" from="0" to="294" dur="1.5s" begin="0.35s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Kafka -->
  <g transform="translate(50, 158)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">Kafka</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">88%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad)">
        <animate attributeName="width" from="0" to="282" dur="1.5s" begin="0.5s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- System Design -->
  <g transform="translate(50, 208)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">System Design</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">85%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad)">
        <animate attributeName="width" from="0" to="272" dur="1.5s" begin="0.65s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Microservices -->
  <g transform="translate(50, 258)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">Microservices</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">90%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad)">
        <animate attributeName="width" from="0" to="288" dur="1.5s" begin="0.8s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- ===== Right Column ===== -->

  <!-- MySQL -->
  <g transform="translate(470, 58)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">MySQL</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">88%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad2)">
        <animate attributeName="width" from="0" to="282" dur="1.5s" begin="0.3s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- MongoDB -->
  <g transform="translate(470, 108)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">MongoDB</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">85%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad2)">
        <animate attributeName="width" from="0" to="272" dur="1.5s" begin="0.45s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Elasticsearch -->
  <g transform="translate(470, 158)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">Elasticsearch</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">82%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad2)">
        <animate attributeName="width" from="0" to="262" dur="1.5s" begin="0.6s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Redis -->
  <g transform="translate(470, 208)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">Redis</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">80%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad2)">
        <animate attributeName="width" from="0" to="256" dur="1.5s" begin="0.75s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Docker / K8s -->
  <g transform="translate(470, 258)">
    <text x="0" y="12" font-family="'SF Mono','Courier New',monospace" font-size="12" fill="#e2e2f0" font-weight="600">Docker / K8s</text>
    <text x="320" y="12" font-family="'SF Mono','Courier New',monospace" font-size="11" fill="#48bfe3" text-anchor="end">78%</text>
    <g transform="translate(0, 20)">
      <rect width="320" height="12" rx="6" fill="#1e1e30"/>
      <rect width="0" height="12" rx="6" fill="url(#sGrad2)">
        <animate attributeName="width" from="0" to="250" dur="1.5s" begin="0.9s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- Divider line between columns -->
  <line x1="420" y1="52" x2="420" y2="285" stroke="#1e1e30" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Column labels -->
  <text x="210" y="310"
        font-family="'SF Mono','Courier New',monospace"
        font-size="10"
        fill="#6c63ff"
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.6">
    BACKEND &#x26; ARCHITECTURE
  </text>
  <text x="630" y="310"
        font-family="'SF Mono','Courier New',monospace"
        font-size="10"
        fill="#8b83ff"
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.6">
    DATA &#x26; INFRASTRUCTURE
  </text>

  <!-- Subtle particles -->
  <circle cx="30" cy="20" r="1.5" fill="#6c63ff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.07;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="15" r="1" fill="#48bfe3" opacity="0.15"/>
  <circle cx="25" cy="325" r="1" fill="#48bfe3" opacity="0.15"/>
  <circle cx="815" cy="330" r="1.5" fill="#6c63ff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.07;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>

</svg>
