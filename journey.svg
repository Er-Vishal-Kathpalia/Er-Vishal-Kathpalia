<svg width="840" height="200" viewBox="0 0 840 200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="jGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#48bfe3"/>
    </linearGradient>
    <linearGradient id="jGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#48bfe3" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="840" height="200" rx="12" fill="#0f0f17" stroke="#1e1e30" stroke-width="1.5"/>

  <!-- Title -->
  <text x="420" y="32"
        font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="13"
        fill="#5a5a72"
        text-anchor="middle"
        letter-spacing="3">
    JOURNEY @ TEKION CORP
  </text>

  <!-- Timeline track -->
  <rect x="80" y="82" width="680" height="3" rx="1.5" fill="#1e1e30"/>
  <!-- Animated gradient fill -->
  <rect x="80" y="82" width="680" height="3" rx="1.5" fill="url(#jGrad)" opacity="0.6">
    <animate attributeName="width" from="0" to="680" dur="2s" fill="freeze"/>
  </rect>
  <!-- Glow behind the track -->
  <rect x="80" y="78" width="680" height="11" rx="5" fill="url(#jGlow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="2s" fill="freeze"/>
  </rect>

  <!-- Node 1: Intern -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
    <circle cx="120" cy="83" r="8" fill="#0f0f17" stroke="#6c63ff" stroke-width="2"/>
    <circle cx="120" cy="83" r="3.5" fill="#6c63ff"/>
    <text x="120" y="115"
          font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="12"
          fill="#e2e2f0"
          text-anchor="middle"
          font-weight="600">
      Intern
    </text>
    <text x="120" y="132"
          font-family="'SF Mono','Courier New',monospace"
          font-size="10"
          fill="#5a5a72"
          text-anchor="middle">
      Jan 2022
    </text>
    <text x="120" y="65"
          font-family="'SF Mono','Courier New',monospace"
          font-size="9"
          fill="#48bfe3"
          text-anchor="middle"
          opacity="0.7">
      Built recruitment portal
    </text>
  </g>

  <!-- Node 2: Associate SDE -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    <circle cx="320" cy="83" r="8" fill="#0f0f17" stroke="#7a73ff" stroke-width="2"/>
    <circle cx="320" cy="83" r="3.5" fill="#7a73ff"/>
    <text x="320" y="115"
          font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="12"
          fill="#e2e2f0"
          text-anchor="middle"
          font-weight="600">
      Associate SDE
    </text>
    <text x="320" y="132"
          font-family="'SF Mono','Courier New',monospace"
          font-size="10"
          fill="#5a5a72"
          text-anchor="middle">
      Jul 2022
    </text>
    <text x="320" y="65"
          font-family="'SF Mono','Courier New',monospace"
          font-size="9"
          fill="#48bfe3"
          text-anchor="middle"
          opacity="0.7">
      90x perf boost
    </text>
  </g>

  <!-- Node 3: SDE I -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
    <circle cx="520" cy="83" r="8" fill="#0f0f17" stroke="#5fb3de" stroke-width="2"/>
    <circle cx="520" cy="83" r="3.5" fill="#5fb3de"/>
    <text x="520" y="115"
          font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="12"
          fill="#e2e2f0"
          text-anchor="middle"
          font-weight="600">
      SDE I
    </text>
    <text x="520" y="132"
          font-family="'SF Mono','Courier New',monospace"
          font-size="10"
          fill="#5a5a72"
          text-anchor="middle">
      Jan 2024
    </text>
    <text x="520" y="65"
          font-family="'SF Mono','Courier New',monospace"
          font-size="9"
          fill="#48bfe3"
          text-anchor="middle"
          opacity="0.7">
      Millions migrated
    </text>
  </g>

  <!-- Node 4: SDE II (current — pulsing ring) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.9s" fill="freeze"/>
    <!-- Pulse ring -->
    <circle cx="720" cy="83" r="8" fill="none" stroke="#48bfe3" stroke-width="2" opacity="0.4">
      <animate attributeName="r" values="8;16;8" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="83" r="8" fill="#0f0f17" stroke="#48bfe3" stroke-width="2.5"/>
    <circle cx="720" cy="83" r="3.5" fill="#48bfe3"/>
    <text x="720" y="115"
          font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="12"
          fill="#e2e2f0"
          text-anchor="middle"
          font-weight="700">
      SDE II
    </text>
    <text x="720" y="132"
          font-family="'SF Mono','Courier New',monospace"
          font-size="10"
          fill="#48bfe3"
          text-anchor="middle"
          font-weight="bold">
      Apr 2025
    </text>
    <text x="720" y="65"
          font-family="'SF Mono','Courier New',monospace"
          font-size="9"
          fill="#48bfe3"
          text-anchor="middle"
          opacity="0.7">
      AI + System Design
    </text>
  </g>

  <!-- Bottom accent -->
  <text x="420" y="168"
        font-family="'SF Mono','Courier New',monospace"
        font-size="11"
        fill="#5a5a72"
        text-anchor="middle"
        letter-spacing="1">
    4+ years &#x2022; 12+ microservices &#x2022; systems serving millions
  </text>

  <!-- Subtle particles -->
  <circle cx="40" cy="30" r="1.5" fill="#6c63ff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.08;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="25" r="1" fill="#48bfe3" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.06;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="175" r="1.5" fill="#6c63ff" opacity="0.15"/>
  <circle cx="60" cy="170" r="1" fill="#48bfe3" opacity="0.15"/>

</svg>
